name: Production Sync CI/CD Pipeline

on:
  push:
    branches:
      - master # ⚡ FIXED: Changed from 'main' to match your exact branch name 'master'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Compile Production Bundle
        run: |
          npm ci
          npm run build

      - name: Stream Static Distribution to InMotion
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.INMOTION_FTP_SERVER }}
          username: ${{ secrets.INMOTION_FTP_USERNAME }}
          password: ${{ secrets.INMOTION_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
